<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SOLERA</title>
<meta name="theme-color" content="#343434">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script>
// la app SOLERA tiene como ámbito index.html (así no se mezcla con "SOLERA Almacén", que vive en almacen/)
if (/\/$/.test(location.pathname)) location.replace('index.html' + location.search);
// ?modo=almacen (acceso directo "SOLERA Almacén", almacen.html): misma app, arranca en Almacén y sin la pestaña Parte
var MODO_ALMACEN = /[?&]modo=almacen(&|$)/.test(location.search);
if (MODO_ALMACEN) {
  document.write('<link rel="manifest" href="manifest-almacen.json"><link rel="apple-touch-icon" href="icon-almacen-192.png">');
  document.title = 'SOLERA Almacén';
} else document.write('<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">');
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--azul:#343434;--azul2:#646464;--ambar:#f9b526;--fondo:#f4f4f4;--borde:#d9d9d9;--texto:#222;--gris:#646464;--rojo:#c62828;--verde:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font:16px/1.4 'Source Sans 3',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--azul);color:#fff;border-bottom:3px solid var(--ambar);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:3px;font-family:'Prompt',sans-serif;font-weight:600;color:var(--ambar)}
.tarjeta h2,.btn,.modal .cab b,nav button.activa{font-family:'Prompt',sans-serif}
header .quien{font-size:12px;opacity:.85}
.estado{font-size:12px;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.18)}
.estado.off{background:var(--ambar);color:#343434}
main{padding:12px 12px 90px;max-width:720px;margin:0 auto}
.pantalla{display:none}.pantalla.activa{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 8px;font-size:12px;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav button.activa{color:var(--azul);font-weight:600;border-top:3px solid var(--ambar);margin-top:-1px}
nav .punto{position:absolute;margin-left:28px;margin-top:-2px;background:var(--rojo);color:#fff;font-size:10px;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
.tarjeta h2{font-size:14px;margin:0 0 10px;color:var(--azul);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:13px;color:var(--gris);margin:8px 0 3px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:11px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
.fila{display:flex;gap:8px;align-items:flex-end}
.fila>*{flex:1;min-width:0}
.fila .corto{flex:0 0 64px}
.fila .icono{flex:0 0 44px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ambar);color:#343434;font-size:17px;font-weight:600;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sec{background:#fff;color:var(--azul);border:2px solid var(--azul)}
.btn.rojo,.btn.verde{color:#fff}
.btn.peq{padding:9px;font-size:14px;margin-top:6px;width:auto;display:inline-block}
.btn.rojo{background:var(--rojo)}
.btn.verde{background:var(--verde)}
.x{border:1px solid var(--borde);background:#fff;border-radius:8px;height:44px;width:44px;color:var(--rojo);font-size:20px}
.linea{border-top:1px dashed var(--borde);margin:8px 0}
.aviso{padding:10px 12px;border-radius:8px;background:#fff8e1;border:1px solid #ffe08a;font-size:14px;margin:8px 0}
.aviso.ok{background:#e8f5e9;border-color:#a5d6a7}
.aviso.err{background:#ffebee;border-color:#ef9a9a}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pinpad button{padding:18px;font-size:22px;border:1px solid var(--borde);background:#fff;border-radius:12px}
.pin{letter-spacing:12px;text-align:center;font-size:28px;height:54px;line-height:54px;background:#fff;border:1px solid var(--borde);border-radius:8px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fotos div{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--borde)}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:14px}
.firma-prev{border:1px solid var(--borde);border-radius:8px;background:#fff;height:90px;display:flex;align-items:center;justify-content:center;color:var(--gris);overflow:hidden}
.firma-prev img{height:100%}
.modal{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}
.modal.activa{display:flex}
.modal .cab{padding:12px;background:var(--azul);color:#fff;display:flex;justify-content:space-between;align-items:center}
.modal canvas{flex:1;touch-action:none;background:#fff;background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 40px}
.modal .cab{border-bottom:3px solid var(--ambar)}
.modal .pie{display:flex;gap:8px;padding:10px}
.modal .pie .btn{margin:0}
.lista .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--borde);gap:8px}
.lista .item:last-child{border:0}
.modo-almacen nav button[data-p="parte"]{display:none}
.modo-almacen header h1{letter-spacing:1px;white-space:nowrap}
.lista .item.toca{cursor:pointer}
.historial{padding:0 0 10px;font-size:13px;color:var(--gris)}
.historial div{padding:5px 0;border-top:1px dashed var(--borde)}
.historial b{color:var(--texto)}
.fecha-campo{position:relative}
.fecha-campo span{display:block;padding:11px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:16px;min-height:44px}
.fecha-campo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ayuda{font-size:12px;color:var(--gris);margin:3px 0 8px}
a.ayuda{display:inline-block;color:var(--azul)}
.dueno{font-family:'Prompt',sans-serif;font-size:20px;font-weight:600;color:var(--azul);margin:4px 0 0}
.fila.mat>div:first-child{flex:3;position:relative}
.fila.mat .sugs{position:absolute;left:0;right:0;top:100%;z-index:6;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.sugs{border:1px solid var(--borde);border-top:0;border-radius:0 0 8px 8px;background:#fff}
.sugs div{padding:10px 11px;border-top:1px solid var(--borde);font-size:15px;cursor:pointer}
.sugs small{display:block;color:var(--gris);font-size:12px}
.lista small{color:var(--gris);display:block}
.chip{font-size:12px;padding:3px 8px;border-radius:10px;background:#eef1f7;color:var(--azul);white-space:nowrap}
.chip.pend{background:#fff3d6;color:#9a6a00}.chip.ok{background:#e8f5e9;color:var(--verde)}.chip.err{background:#ffebee;color:var(--rojo)}
.stock{font-weight:700;font-size:18px;min-width:70px;text-align:right}
.stock.bajo{color:var(--rojo)}
.buscar{position:sticky;top:58px;z-index:3;background:var(--fondo);padding:4px 0 8px}
.total{font-weight:700;color:var(--azul);text-align:right;margin-top:6px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:90%}
.toast.ver{opacity:1}
a{color:var(--azul)}
</style>
</head>
<body>
<header>
  <div><h1>SOLERA</h1><div class="quien" id="quien"></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="estado" id="estado">—</span>
    <button id="btnSalir" class="x" style="display:none;color:#fff;background:none;border-color:rgba(255,255,255,.4);width:auto;padding:0 10px;font-size:13px;height:30px">Salir</button>
  </div>
</header>

<main>
<!-- LOGIN -->
<section class="pantalla" id="p-login">
  <div class="tarjeta">
    <h2>Entrar</h2>
    <div id="loginAviso"></div>
    <div id="duenoBloque" style="display:none">
      <div class="dueno" id="duenoNombre"></div>
      <a href="#" id="cambiarPersona" class="ayuda">¿No eres tú? Cambiar de persona</a>
    </div>
    <div id="loginLista">
      <label>¿Quién eres?</label>
      <select id="loginTrab"></select>
    </div>
    <button class="btn verde" id="btnHuella" style="display:none">👆 Entrar con huella</button>
    <label>PIN</label>
    <div class="pin" id="pinVista"></div>
    <div class="pinpad" id="pinpad"></div>
    <button class="btn" id="btnEntrar">Entrar</button>
    <button class="btn sec" id="btnCargar">Actualizar listas (necesita datos)</button>
  </div>
</section>

<!-- PARTE -->
<section class="pantalla" id="p-parte">
  <div class="tarjeta">
    <h2>Nuevo parte</h2>
    <div class="fila">
      <div><label>Fecha</label><div class="fecha-campo"><span id="fechaVer"></span><input type="date" id="fecha"></div></div>
    </div>
    <label>Obra</label>
    <input type="text" id="obraTxt" placeholder="Escribe la obra…" autocomplete="off">
    <div class="sugs" id="obraSugs" style="display:none"></div>
    <select id="obra" style="display:none"></select>
  </div>

  <div class="tarjeta">
    <h2>Personal</h2>
    <div id="trabs"></div>
    <button class="btn sec peq" id="addTrab">+ Añadir trabajador</button>
    <div class="total" id="totalHoras">Total: 0 h</div>
  </div>

  <div class="tarjeta">
    <h2>Trabajos realizados</h2>
    <textarea id="trabajos" placeholder="Qué se ha hecho hoy…"></textarea>
  </div>

  <div class="tarjeta">
    <h2>Materiales usados</h2>
    <div id="mats"></div>
    <button class="btn sec peq" id="addMat">+ Añadir material</button>
    <label>Medios / maquinaria / portes</label>
    <input type="text" id="medios" placeholder="Martillo perforador, furgón, contenedor…">
    <label>Observaciones</label>
    <input type="text" id="observaciones">
  </div>

  <div class="tarjeta">
    <h2>Fotos de la obra</h2>
    <input type="file" id="fotoInput" accept="image/*" capture="environment" multiple style="display:none">
    <button class="btn sec peq" id="btnFoto">📷 Hacer / elegir foto</button>
    <div class="fotos" id="fotos"></div>
  </div>

  <div class="tarjeta">
    <h2>Conforme del cliente</h2>
    <label>Nombre de quien firma (opcional)</label>
    <input type="text" id="firmante" placeholder="Encargado de la tienda…" autocomplete="off">
    <div class="sugs" id="firmanteSugs" style="display:none"></div>
    <label>Correo para la copia</label>
    <input type="email" id="firmanteEmail" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="correo@ejemplo.com">
    <div class="ayuda">Recibirá una copia del parte firmado</div>
    <div class="firma-prev" id="firmaPrev">Sin firma</div>
    <div class="fila">
      <button class="btn sec peq" id="btnFirmar">✍️ Firmar</button>
      <button class="btn sec peq" id="btnBorrarFirma" style="color:var(--rojo);border-color:var(--rojo)">Quitar firma</button>
    </div>
  </div>

  <div id="parteAviso"></div>
  <button class="btn verde" id="btnGuardarParte">Guardar parte</button>
</section>

<!-- ALMACÉN -->
<section class="pantalla" id="p-almacen">
  <div class="buscar"><input type="text" id="buscarMat" placeholder="Buscar material…"></div>
  <div class="tarjeta">
    <div class="fila">
      <button class="btn peq verde" id="btnEntrada">⬇ Entrada</button>
      <button class="btn peq" id="btnSalida">⬆ Salida a obra</button>
    </div>
  </div>
  <div class="tarjeta lista" id="stockLista"></div>

  <div class="tarjeta" id="movForm" style="display:none">
    <h2 id="movTitulo">Movimiento</h2>
    <div class="ayuda" id="movCuando"></div>
    <label>Material</label><input type="text" id="movMatTxt" placeholder="Escribe el material…" autocomplete="off"><div class="sugs" id="movMatSugs" style="display:none"></div>
    <label>Cantidad</label><input type="number" id="movCant" inputmode="decimal" step="any" min="0">
    <div id="movObraBloque"><label>Obra</label><input type="text" id="movObraTxt" placeholder="Escribe la obra…" autocomplete="off"><div class="sugs" id="movObraSugs" style="display:none"></div><select id="movObra" style="display:none"></select></div>
    <label>Comentario (albarán, proveedor…)</label><input type="text" id="movNota">
    <input type="file" id="movFotoInput" accept="image/*" multiple style="display:none">
    <button class="btn sec peq" id="movBtnFoto">📷 Foto (albarán, material…)</button>
    <div class="fotos" id="movFotos"></div>
    <div class="fila">
      <button class="btn peq sec" id="movCancelar">Cancelar</button>
      <button class="btn peq verde" id="movGuardar">Guardar</button>
    </div>
  </div>
</section>

<!-- ENVIADOS -->
<section class="pantalla" id="p-enviados">
  <div class="tarjeta">
    <h2>Pendientes de enviar</h2>
    <div class="lista" id="colaLista"></div>
    <button class="btn peq" id="btnSync">Enviar ahora</button>
  </div>
  <div class="tarjeta">
    <h2>Partes enviados</h2>
    <div class="lista" id="histLista"></div>
  </div>
</section>
</main>

<nav id="nav">
  <button data-p="parte" class="activa"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Parte</button>
  <button data-p="almacen"><svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 21v-8h8v8"/></svg>Almacén</button>
  <button data-p="enviados"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Enviados<span class="punto" id="pendNum" style="display:none"></span></button>
</nav>

<!-- MODAL FIRMA -->
<div class="modal" id="modalFirma">
  <div class="cab"><b>Firme aquí el conforme</b><span id="firmaObra" style="font-size:13px;opacity:.85"></span></div>
  <canvas id="lienzo"></canvas>
  <div class="pie">
    <button class="btn sec" id="firmaLimpiar">Limpiar</button>
    <button class="btn rojo" id="firmaCancelar">Cancelar</button>
    <button class="btn verde" id="firmaOk">Aceptar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function () {
'use strict';
var CFG = window.SOLERA_CONFIG || {};
var $ = function (id) { return document.getElementById(id); };

// ---------------------------------------------------------------- almacenamiento local (IndexedDB)
var DB = {
  db: null,
  abrir: function () {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('solera', 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        d.createObjectStore('cola', { keyPath: 'id' });
        d.createObjectStore('hist', { keyPath: 'id' });
        d.createObjectStore('kv');
      };
      r.onsuccess = function () { DB.db = r.result; res(); };
      r.onerror = function () { rej(r.error); };
    });
  },
  op: function (store, modo, fn) {
    return new Promise(function (res, rej) {
      var t = DB.db.transaction(store, modo), s = t.objectStore(store), out = fn(s);
      t.oncomplete = function () { res(out ? out.result : undefined); };
      t.onerror = function () { rej(t.error); };
    });
  },
  put: function (store, v, k) { return DB.op(store, 'readwrite', function (s) { return k !== undefined ? s.put(v, k) : s.put(v); }); },
  del: function (store, k) { return DB.op(store, 'readwrite', function (s) { return s.delete(k); }); },
  get: function (store, k) { return DB.op(store, 'readonly', function (s) { return s.get(k); }); },
  all: function (store) { return DB.op(store, 'readonly', function (s) { return s.getAll(); }); }
};

// ---------------------------------------------------------------- estado
var S = { datos: null, usuario: null, firma: null, fotos: [], movFotos: [], pantalla: 'parte', movTipo: 'ENTRADA' };

function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('ver'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('ver'); }, 2600); }
function aviso(id, msg, tipo) { $(id).innerHTML = msg ? '<div class="aviso ' + (tipo || '') + '">' + msg + '</div>' : ''; }
function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fechaES(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso || ''); }
function ahoraES() { var d = new Date(), z = function (n) { return String(n).padStart(2, '0'); }; return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function normal(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function estadoRed() {
  var e = $('estado');
  if (!navigator.onLine) { e.textContent = 'Sin conexión'; e.className = 'estado off'; }
  else { e.textContent = 'Conectado'; e.className = 'estado'; }
}

// ---------------------------------------------------------------- API
function api(action, extra) {
  var body = Object.assign({ action: action, token: CFG.TOKEN }, extra || {});
  return fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error del servidor'); return j; });
}

function cargarDatos(silencioso) {
  if (!silencioso) toast('Actualizando listas…');
  return api('bootstrap').then(function (j) {
    S.datos = j; return DB.put('kv', j, 'datos');
  }).then(function () { pintarListas(); if (!silencioso) toast('Listas actualizadas'); })
    .catch(function (e) { if (!silencioso) toast('No se pudo actualizar: ' + e.message); });
}

// ---------------------------------------------------------------- login
var pin = '';
function pintarPin() { $('pinVista').textContent = '•'.repeat(pin.length); }
function montarPinpad() {
  var p = $('pinpad'); p.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(function (k) {
    var b = document.createElement('button'); b.textContent = k;
    b.onclick = function () {
      if (k === 'C') pin = ''; else if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
      pintarPin();
    };
    p.appendChild(b);
  });
}
function entrar() {
  var codigo = $('loginTrab').value;
  if (!codigo) return aviso('loginAviso', 'Primero pulsa "Actualizar listas" con conexión.', 'err');
  if (pin.length < 4) return aviso('loginAviso', 'Escribe tu PIN de 4 cifras.', 'err');
  var btn = $('btnEntrar'); btn.disabled = true;
  var terminar = function (u) {
    S.usuario = u; S.dueno = u; S.cambiandoPersona = false; pin = ''; pintarPin();
    // el móvil queda asociado a quien entra; se ofrece la huella si el móvil la tiene y aún no está puesta
    DB.put('kv', u, 'dueno').then(function () { return DB.put('kv', u, 'usuario'); }).then(function () { mostrarApp(); ofrecerHuella(u); });
  };
  var pinIntento = pin;
  api('login', { codigo: codigo, pin: pin }).then(function (j) { DB.put('kv', pinIntento, 'pin-' + codigo); terminar(j.trabajador); })
    .catch(function (e) {
      // sin conexión: se permite entrar si ese usuario ya entró antes en este móvil con el mismo PIN
      DB.get('kv', 'pin-' + codigo).then(function (guardado) {
        if (!navigator.onLine && guardado && guardado === pinIntento) {

// ---------------------------------------------------------------- dueño del móvil y huella
// La huella (o cara/patrón) la comprueba el propio móvil (WebAuthn); aquí solo se guarda el id de esa llave.
var huella = {
  disponible: function () {
    return window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
      ? PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; }) : Promise.resolve(false);
  },
  crear: function (u) {
    return navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'SOLERA' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: String(u.codigo), displayName: u.nombre },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000, attestation: 'none' } }).then(function (c) { return Array.prototype.slice.call(new Uint8Array(c.rawId)); });
  },
  comprobar: function (id) {
    return navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: new Uint8Array(id) }], userVerification: 'required', timeout: 60000 } });
  }
};
function ofrecerHuella(u) {

      if (!si || !confirm('¿Quieres entrar con la huella en este móvil a partir de ahora?')) return;
      return huella.crear(u).then(function (id) { return DB.put('kv', { codigo: u.codigo, id: id }, 'huella'); })
        .then(function () { toast('Huella activada'); });

// elegir(item, alEscribir) recibe el elemento elegido, o null si lo escrito no coincide con ninguno
function buscador(txt, caja, lista, elegir) {
  var mostrar = function () {
    var palabras = normal(txt.value).split(' ').filter(Boolean);
    var res = lista().filter(function (x) {
      var ws = normal(x.nombre).split(/[^a-z0-9,]+/);
      return palabras.every(function (p) { return ws.some(function (w) { return w.indexOf(p) === 0; }); });
    }).slice(0, 8);
    var exacto = res.filter(function (x) { return normal(x.nombre) === normal(txt.value); })[0];
    elegir(exacto || null, true);
    caja.innerHTML = res.map(function (x, i) { return '<div data-i="' + i + '">' + esc(x.nombre) + '</div>'; }).join('');
    caja.querySelectorAll('div').forEach(function (o) {
      o.onmousedown = function (e) { e.preventDefault(); var x = res[+o.dataset.i]; txt.value = x.nombre; caja.style.display = 'none'; elegir(x, false); };
    });
    caja.style.display = res.length && !exacto ? '' : 'none';
  };
  txt.oninput = txt.onfocus = mostrar;
  txt.onblur = function () { caja.style.display = 'none'; };
}

function comprimir(file) {
  return new Promise(function (res) {

    img.onload = function () {

      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

    img.onerror = function () { res(null); };

}

var lienzo = $('lienzo'), ctx, dibujando = false, hayTrazo = false;

  var ob = $('obra'); $('firmaObra').textContent = ob.options[ob.selectedIndex] ? ob.options[ob.selectedIndex].text : '';

    var r = lienzo.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    lienzo.width = r.width * dpr; lienzo.height = r.height * dpr;
    ctx = lienzo.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#343434';
    hayTrazo = false;
  });
}
function pos(e) { var r = lienzo.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return [p.clientX - r.left, p.clientY - r.top]; }
lienzo.addEventListener('pointerdown', function (e) { dibujando = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); lienzo.setPointerCapture(e.pointerId); });
lienzo.addEventListener('pointermove', function (e) { if (!dibujando) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); hayTrazo = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { lienzo.addEventListener(ev, function () { dibujando = false; }); });

$('firmaOk').onclick = function () {
  if (!hayTrazo) return toast('No hay firma');

  var w = lienzo.width, h = lienzo.height, d = lienzo.getContext('2d').getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  var c = document.createElement('canvas'), m = 10; c.width = x1 - x0 + m * 2; c.height = y1 - y0 + m * 2;
  var cc = c.getContext('2d'); cc.fillStyle = '#fff'; cc.fillRect(0, 0, c.width, c.height);
  cc.drawImage(lienzo, x0 - m, y0 - m, c.width, c.height, 0, 0, c.width, c.height);
  S.firma = c.toDataURL('image/png'); S.firmadoEn = ahoraES(); pintarFirma();

};

  $('movCuando').textContent = 'Fecha y hora: ' + S.movCuando + ' · el nº se asigna al enviarlo';
  S.movFotos = []; pintarFotosEn('movFotos', S.movFotos);
  $('movForm').scrollIntoView({ behavior: 'smooth' });
}
$('btnEntrada').onclick = function () { abrirMov('ENTRADA'); };
$('btnSalida').onclick = function () { abrirMov('SALIDA'); };
$('movCancelar').onclick = function () { $('movForm').style.display = 'none'; };
$('movGuardar').onclick = function () {
  var nombreMat = $('movMatTxt').value.trim(), cant = +$('movCant').value;
  if (!nombreMat || !cant) return toast('Escribe material y cantidad');
  // si no se eligió de la lista, va como texto libre (código OTRO, no cuenta en el stock)
  var mat = S.movMat ? String(S.movMat.codigo) : 'OTRO', matNombre = S.movMat ? S.movMat.nombre : nombreMat.toUpperCase();
  if (S.movTipo === 'SALIDA' && !$('movObra').value) return toast('Elige la obra');
  var obraSel = $('movObra'), obraTxt = S.movTipo === 'SALIDA' ? obraSel.options[obraSel.selectedIndex].text : '';
  var mov = { id: uid(), tipo: 'mov', movTipo: S.movTipo, material: mat, materialNombre: matNombre, hora: S.movCuando.slice(11), cantidad: cant, obra: obraTxt, nota: $('movNota').value.trim(), fotos: S.movFotos.slice(), fecha: hoyISO(), usuario: S.usuario.nombre, creadoEn: new Date().toISOString() };
  // ajuste optimista del stock local
  stockLocal().forEach(function (m) { if (m.codigo === mat) m.stock += (S.movTipo === 'ENTRADA' ? cant : -cant); });
  DB.put('kv', S.datos, 'datos');
  DB.put('cola', mov).then(function () { $('movForm').style.display = 'none'; pintarStock(); toast('Movimiento guardado'); actualizarPend(); sincronizar(); });
};

// ---------------------------------------------------------------- sincronización
var sincronizando = false;
function actualizarPend() {
  return DB.all('cola').then(function (c) {
    var n = c.length, p = $('pendNum'); p.textContent = n; p.style.display = n ? '' : 'none';
    if (S.pantalla === 'enviados') pintarEnviados();
    return n;
  });
}
function sincronizar() {
  if (sincronizando || !navigator.onLine) return Promise.resolve();
  sincronizando = true;
  return DB.all('cola').then(function (cola) {
    cola.sort(function (a, b) { return a.creadoEn < b.creadoEn ? -1 : 1; });
    var p = Promise.resolve(), enviados = 0;
    cola.forEach(function (it) {
      p = p.then(function () {
        var llamada = it.tipo === 'parte'
          ? api('crearParte', { parte: it })
          : api('movimiento', { mov: { id: it.id, tipo: it.movTipo, material: it.material, cantidad: it.cantidad, obra: it.obra, nota: it.nota, fotos: it.fotos || [], fecha: it.fecha, usuario: it.usuario, materialNombre: it.materialNombre, hora: it.hora } });
        return llamada.then(function (j) {
          enviados++;
          var h = { id: it.id, tipo: it.tipo, fecha: it.fecha, obra: it.obraNombre || it.obra, numero: j.numero || '', pdf_url: j.pdf_url || '', firmado: !!it.firma, enviadoEn: new Date().toISOString(), copia: j.copia_enviada_a || '', copiaError: j.copia_error || '', resumen: it.tipo === 'mov' ? it.movTipo + ' ' + it.cantidad + ' ' + (it.materialNombre || it.material) : '', hora: it.hora || '' };
          return DB.put('hist', h).then(function () { return DB.del('cola', it.id); });
        }).catch(function (e) {
          it.error = e.message; it.intentos = (it.intentos || 0) + 1; return DB.put('cola', it);
        });
      });
    });
    return p.then(function () { if (enviados) toast(enviados + ' elemento(s) enviados'); });
  }).then(function () { sincronizando = false; return actualizarPend(); })
    .then(function (n) { if (n === 0 && navigator.onLine) cargarDatos(true); })
    .catch(function () { sincronizando = false; });
}
function pintarEnviados() {
  DB.all('cola').then(function (c) {
    $('colaLista').innerHTML = c.length ? c.map(function (it) {
      return '<div class="item"><div><b>' + (it.tipo === 'parte' ? 'Parte · ' + esc(it.obraNombre) : 'Almacén · ' + esc(it.movTipo) + ' ' + it.cantidad + ' ' + esc(it.materialNombre || it.material)) + '</b><small>' + fechaES(it.fecha) + (it.hora ? ' ' + esc(it.hora) : '') + (it.error ? ' · <span style="color:var(--rojo)">' + esc(it.error) + '</span>' : '') + '</small></div><span class="chip ' + (it.error ? 'err' : 'pend') + '">' + (it.error ? 'reintentar' : 'pendiente') + '</span></div>';
    }).join('') : '<div class="aviso ok">Todo enviado.</div>';
  });
  DB.all('hist').then(function (h) {
    h.sort(function (a, b) { return a.enviadoEn < b.enviadoEn ? 1 : -1; }); h = h.slice(0, 50);
    $('histLista').innerHTML = h.length ? h.map(function (it) {
      if (it.tipo === 'mov') return '<div class="item"><div><b>' + (it.numero ? 'Nº ' + esc(it.numero) + ' · ' : 'Almacén · ') + esc(it.resumen) + '</b><small>' + fechaES(it.fecha) + (it.hora ? ' ' + esc(it.hora) : '') + '</small></div><span class="chip ok">ok</span></div>';
      return '<div class="item"><div><b>Nº ' + esc(it.numero) + ' · ' + esc(it.obra) + '</b><small>' + fechaES(it.fecha) + (it.firmado ? ' · firmado' : ' · sin firma') + (it.copia ? ' · copia enviada a ' + esc(it.copia) : '') + (it.copiaError ? ' · <span style="color:var(--rojo)">copia no enviada</span>' : '') + '</small></div>' + (it.pdf_url ? '<a class="chip ok" href="' + esc(it.pdf_url) + '" target="_blank">PDF</a>' : '<span class="chip ok">ok</span>') + '</div>';
    }).join('') : '<div class="aviso">Aún no hay partes enviados desde este móvil.</div>';
  });
}

// ---------------------------------------------------------------- arranque
$('addTrab').onclick = function () { filaTrab(); };
$('addMat').onclick = function () { filaMat(); };
$('btnEntrar').onclick = entrar;
$('btnSalir').onclick = salir;
$('btnCargar').onclick = function () { cargarDatos(); };
$('btnSync').onclick = function () { if (!navigator.onLine) return toast('Sin conexión'); sincronizar(); };
document.querySelectorAll('nav button').forEach(function (b) { b.onclick = function () { cambiar(b.dataset.p); }; });
window.addEventListener('online', function () { estadoRed(); sincronizar(); });
window.addEventListener('offline', estadoRed);

if (MODO_ALMACEN) { document.body.classList.add('modo-almacen'); document.querySelector('header h1').textContent = 'SOLERA · ALMACÉN'; }

DB.abrir().then(function () {
  return Promise.all([DB.get('kv', 'datos'), DB.get('kv', 'usuario')]);
}).then(function (r) {
  S.datos = r[0] || null; S.usuario = r[1] || null;
  montarPinpad(); estadoRed(); pintarListas(); actualizarPend();
  // con la huella activada, cada vez que se abre la app se pide la huella (o el PIN)
  DB.get('kv', 'huella').then(function (h) {
    if (S.usuario && S.datos && !(h && String(h.codigo) === String(S.usuario.codigo))) mostrarApp(); else mostrarLogin();
  });
  if (navigator.onLine) cargarDatos(true).then(sincronizar);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  setInterval(function () { if (navigator.onLine) sincronizar(); }, 60000);
});
})();
</script>
